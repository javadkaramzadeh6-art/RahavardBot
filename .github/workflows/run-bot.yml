name: Run Bot

on:
  schedule:
    - cron: '*/15 5-10 * * 0-4'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          RAHAVARD_TOKEN: ${{ secrets.RAHAVARD_TOKEN }}
